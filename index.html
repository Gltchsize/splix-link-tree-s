<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splix - Link Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a002e 50%, #00001a 100%);
            color: white;
            overflow-x: hidden;
            height: 100vh;
            perspective: 1000px;
            position: relative;
        }

        /* Cosmic background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(92, 99, 235, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 40% 40%, rgba(134, 84, 235, 0.1) 0%, transparent 15%),
                radial-gradient(circle at 60% 60%, rgba(147, 51, 234, 0.1) 0%, transparent 15%);
            pointer-events: none;
            z-index: -2;
            animation: slowShift 20s ease-in-out infinite alternate;
        }

        @keyframes slowShift {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-20px) scale(1.02); }
        }

        /* Stars */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(white, rgba(255,255,255,0) 2px),
                radial-gradient(white, rgba(255,255,255,0) 1px),
                radial-gradient(white, rgba(255,255,255,0) 1px),
                radial-gradient(white, rgba(255,255,255,0) 1px);
            background-position: 10% 20%, 30% 40%, 70% 50%, 80% 60%;
            background-repeat: no-repeat;
            background-size: 150px 150px, 100px 100px, 80px 80px, 60px 60px;
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: -1;
            opacity: 0.8;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Main container */
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* 3D Profile Card */
        .profile-card {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        .profile-card:hover {
            transform: rotateY(15deg) rotateX(10deg);
        }

        .profile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 3px solid transparent;
            background: linear-gradient(45deg, #6c5ce7, #5c63eb, #8a2be2);
        }

        .profile-face.front {
            transform: translateZ(100px);
            background-image: url('https://cdn.discordapp.com/avatars/1119856494213603348/875daadc1b164dd78780042c2e17d697.png?size=256');
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .profile-face.back {
            transform: rotateY(180deg) translateZ(100px);
            background: rgba(108, 92, 231, 0.8);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            text-align: center;
            gap: 0.5rem;
        }

        .profile-face.back h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .profile-face.back p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Links container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 3D Link Cards */
        .link-card {
            position: relative;
            width: 100%;
            padding: 1.5rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .link-card:hover {
            transform: translateZ(20px) scale(1.02);
            box-shadow: 0 12px 48px rgba(108, 92, 231, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(108, 92, 231, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .link-card:hover::before {
            transform: translateX(100%);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .link-text {
            flex: 1;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .link-text:hover {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        /* Social media specific styles */
        .discord-link { border-left: 4px solid #5865F2; }
        .twitter-link { border-left: 4px solid #1DA1F2; }
        .youtube-link { border-left: 4px solid #FF0000; }
        .twitch-link { border-left: 4px solid #9146FF; }
        .github-link { border-left: 4px solid #24292F; }
        .spotify-link { border-left: 4px solid #1DB954; }

        /* Footer */
        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .profile-card {
                width: 150px;
                height: 150px;
            }

            .profile-face {
                font-size: 1.2rem;
            }

            .link-card {
                padding: 1rem;
            }

            .link-text {
                font-size: 1rem;
            }
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 3D Profile Card -->
        <div class="profile-card" id="profileCard">
            <div class="profile-face front"></div>
            <div class="profile-face back">
                <h3>splix</h3>
                <p>fnc_splix#0000</p>
                <p>Online • Desktop</p>
            </div>
            <div class="status-indicator" title="Online on Discord"></div>
        </div>

        <!-- User Info -->
        <div class="user-info">
            <h1>splix</h1>
            <p class="username">fnc_splix</p>
            <p class="status">🟢 Online • Active on Discord Desktop</p>
        </div>

        <!-- Links Container -->
        <div class="links-container">
            <!-- Discord Link -->
            <a href="https://discord.com/users/1119856494213603348" class="link-card discord-link" target="_blank">
                <div class="link-text">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M12 2v17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Discord
                </div>
            </a>

            <!-- Twitter/X Link -->
            <a href="https://twitter.com/fnc_splix" class="link-card twitter-link" target="_blank">
                <div class="link-text">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-1.28 2.56 4.48 4.48 0 0 0-4.48 4.48A4.48 4.48 0 0 1 2 8.71a5.63 5.63 0 0 0 1.41 3.78 5.64 5.64 0 0 1-2.55-.85v.05a4.47 4.47 0 0 0 3.58 4.4 4.47 4.47 0 0 1-2.02.08a4.47 4.47 0 0 0 4.17 3.08A9.89 9.89 0 0 1 0 17.54a10.89 10.89 0 0 0 11.56-2.94 10.89 10.89 0 0 1-5.82 1.93 10.92 10.92 0 0 0 10.75-6.9z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Twitter/X
                </div>
            </a>

            <!-- YouTube Link -->
            <a href="https://youtube.com/@fnc_splix" class="link-card youtube-link" target="_blank">
                <div class="link-text">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 15L15 12L10 9V15ZM5.5 3A2.5 2.5 0 0 0 3 5.5V18.5A2.5 2.5 0 0 0 5.5 21H18.5A2.5 2.5 0 0 0 21 18.5V5.5A2.5 2.5 0 0 0 18.5 3H5.5Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    YouTube
                </div>
            </a>

            <!-- Twitch Link -->
            <a href="https://twitch.tv/fnc_splix" class="link-card twitch-link" target="_blank">
                <div class="link-text">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 2H3v16h5v4l4-4h5l4 4v-4h5V2zM5 7h5v2H5V7zm4 8H7v-2h2v2zm6 0h-2v-2h2v2z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Twitch
                </div>
            </a>

            <!-- GitHub Link -->
            <a href="https://github.com/fnc_splix" class="link-card github-link" target="_blank">
                <div class="link-text">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    GitHub
                </div>
            </a>

            <!-- Spotify Link -->
            <a href="https://open.spotify.com/user/fnc_splix" class="link-card spotify-link" target="_blank">
                <div class="link-text">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 3v13.27a4 4 0 0 0 7.75 3.48V8a4 4 0 0 1 8 0v7.75a4 4 0 0 0 7.75 3.48V3a9 9 0 0 1-17 0z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Spotify
                </div>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Made with ✨ for splix</p>
            <p id="music-placeholder">🎵 Music will be added soon...</p>
        </div>
    </div>

    <script>
        // Add interactivity to the profile card
        const profileCard = document.getElementById('profileCard');

        // Tilt effect on mouse move
        profileCard.addEventListener('mousemove', (e) => {
            const rect = profileCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * 10;
            const rotateY = ((centerX - x) / centerX) * 10;

            profileCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1, 1, 1)`;
        });

        // Reset tilt on mouse leave
        profileCard.addEventListener('mouseleave', () => {
            profileCard.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
        });

        // Click to flip card (alternative interaction)
        profileCard.addEventListener('click', () => {
            profileCard.classList.toggle('flipped');
        });

        // Add some floating particles for extra 3D effect
        function createParticles() {
            const container = document.body;
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 3 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;

                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;

                particle.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
                particle.style.boxShadow = `0 0 ${Math.random() * 5 + 2}px hsla(${Math.random() * 360}, 70%, 60%, 0.5)`;

                const duration = Math.random() * 15 + 10;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;

                container.appendChild(particle);
            }
        }

        // Add particle styles
        const style = document.createElement('style');
        style.textContent = `
            .particle {
                position: fixed;
                border-radius: 50%;
                pointer-events: none;
                z-index: -1;
                animation: float linear infinite;
            }

            @keyframes float {
                0% {
                    transform: translateY(0) translateX(0);
                    opacity: 0;
                }
                50% {
                    opacity: 0.6;
                }
                100% {
                    transform: translateY(-100vh) translateX(-100px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize particles
        createParticles();
    </script>
</body>
</html>

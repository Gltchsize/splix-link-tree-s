<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=Grenze+Gotisch:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060e;
  --ink:#f4f2ff;
  --muted:#a9a4c4;
  --line:rgba(255,255,255,.1);
  --glass:rgba(20,17,38,.55);
  --st:#80848e;           /* couleur du statut, pilotée par le JS */
  --st-a:rgba(128,132,142,.35);
  --a1:#7c5cff; --a2:#ff4fa3; --a3:#22d3ee;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  display:grid;place-items:center;overflow-x:hidden;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  min-height:100vh;
}

/* ---------- fond aurore : la teinte suit le statut ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform;transition:background 1.6s ease}
.b1{width:56vmax;height:56vmax;left:-14vmax;top:-18vmax;background:var(--a1);animation:d1 26s ease-in-out infinite alternate}
.b2{width:48vmax;height:48vmax;right:-16vmax;top:12vmax;background:var(--a2);animation:d2 32s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;left:18vmax;bottom:-24vmax;background:var(--a3);animation:d3 29s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,10vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-20vmax,-6vmax) scale(.9)}}
@keyframes d3{to{transform:translate(-12vmax,-14vmax) scale(1.2)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
canvas#stars{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ---------- carte ---------- */
.stage{position:relative;z-index:2;width:min(100%,460px);perspective:1100px}
.card{
  --mx:50%;--my:0%;
  position:relative;border-radius:34px;padding:0 0 26px;
  background:
    radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.09),transparent 60%),
    var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px -30px var(--st-a);
  transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow 1.2s ease;
  animation:enter .9s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes enter{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ---------- avatar ---------- */
.head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 26px;margin-top:-78px;position:relative}
.avatar{position:relative;width:148px;height:148px;transform:translateZ(50px)}
.ring{position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--st),transparent 30%,var(--st) 55%,transparent 80%,var(--st));
  animation:spin 7s linear infinite;filter:blur(.3px);transition:filter .6s}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.glow{position:absolute;inset:-22px;border-radius:50%;background:var(--st);opacity:.28;filter:blur(30px);animation:breathe 4s ease-in-out infinite;transition:background 1s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.5;transform:scale(1.08)}}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1a1730;z-index:2}
.dot{position:absolute;right:4px;bottom:4px;z-index:3;width:34px;height:34px;border-radius:50%;
  background:var(--st);border:6px solid #120f22;transition:background .6s}
.dot.online::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--st);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.7)}}

h1{font-family:"Grenze Gotisch","UnifrakturCook",Georgia,serif;font-weight:800;letter-spacing:.01em;font-size:clamp(44px,12vw,58px);line-height:1;margin-top:22px;
  background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%) 200% 0/250% 100% no-repeat,linear-gradient(180deg,#f3e8ff 5%,#c084fc 50%,#7e22ce 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out 2.5s infinite;
  filter:drop-shadow(0 0 16px rgba(168,85,247,.55));transform:translateZ(36px);overflow-wrap:anywhere}
.handle{margin-top:8px;color:var(--muted);font-weight:500;font-size:15px}
.statut-txt{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--st);
  padding:6px 13px;border-radius:99px;background:color-mix(in srgb,var(--st) 14%,transparent);border:1px solid color-mix(in srgb,var(--st) 35%,transparent);transition:all .6s}
.statut-txt i{width:7px;height:7px;border-radius:50%;background:currentColor}

.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#d9d5f2}

/* ---------- bannière, décoration, bio ---------- */
.banner{position:relative;height:160px;border-radius:34px 34px 0 0;background:linear-gradient(135deg,var(--a1),var(--a2)) center/cover no-repeat}
.banner::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(10,8,20,0) 35%,rgba(10,8,20,.6))}
.deco{position:absolute;left:-15px;top:-15px;width:calc(100% + 30px);height:calc(100% + 30px);z-index:4;pointer-events:none;object-fit:contain!important;background:none!important;border-radius:0!important}
.avatar.has-deco .ring{display:none}
.avatar.has-deco .dot{right:8px;bottom:8px}
.badges img.bimg{width:26px;height:26px}
.badge.tag{display:inline-flex;align-items:center;gap:6px}
.badge.tag img{width:16px;height:16px}
.pron{color:var(--muted)}
.about{margin:20px 26px 0;text-align:center}
.bio{font-size:14.5px;line-height:1.65;color:#e7e3fa;white-space:pre-wrap;overflow-wrap:anywhere}
.since{margin-top:16px;font-size:12.5px;color:var(--muted)}
.since strong{display:block;margin-top:3px;color:var(--ink);font-size:14px;font-weight:600}

/* ---------- blocs ---------- */
.stack{display:grid;gap:12px;margin:26px 26px 0}
.panel{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:rgba(255,255,255,.045);border:1px solid var(--line);
  animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.panel .art{flex:none;width:64px;height:64px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:26px;overflow:hidden}
.panel .art img{width:100%;height:100%;object-fit:cover}
.panel .txt{min-width:0;flex:1}
.panel .kind{font-size:12px;color:var(--muted);font-weight:600}
.panel .name{font-weight:700;font-size:15.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .sub{font-size:13px;color:#cfcae8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.panel .time{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.panel.spotify{border-color:rgba(30,215,96,.28);background:linear-gradient(135deg,rgba(30,215,96,.1),rgba(255,255,255,.03))}
.panel.spotify .kind{color:#4be58a}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:9px;overflow:hidden}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#1ed760,#7bffb0);transition:width 1s linear}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-left:8px;vertical-align:middle}
.eq s{display:block;width:3px;background:#4be58a;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:-.4s}.eq s:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.custom{display:flex;gap:10px;align-items:center;justify-content:center;padding:13px 16px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:500;font-size:14.5px;text-align:center}
.custom img{width:22px;height:22px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 26px 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#555;transition:background .4s}
.live.on i{background:#23a55a;box-shadow:0 0 0 0 rgba(35,165,90,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(35,165,90,0)}100%{box-shadow:0 0 0 0 rgba(35,165,90,0)}}
button.copy{font:inherit;font-weight:600;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;transition:background .2s,transform .15s}
button.copy:hover{background:rgba(255,255,255,.14)}
button.copy:active{transform:scale(.95)}
button.copy:focus-visible{outline:2px solid var(--a3);outline-offset:2px}

.skeleton .avatar{background:rgba(255,255,255,.06);border-radius:50%}
.skeleton h1{width:60%;height:40px;border-radius:12px;background:rgba(255,255,255,.07);-webkit-text-fill-color:transparent;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{50%{opacity:.4}}
.error{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:6px 6px 0}
.error strong{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:8px}

/* ---------- texte géant en fond ---------- */
.bgtext{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;display:flex;flex-direction:column;justify-content:space-around;
  font-family:"Grenze Gotisch",Georgia,serif;font-weight:800;font-size:clamp(110px,19vw,280px);line-height:1;white-space:nowrap;
  -webkit-mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.bgtext .row{display:flex;width:max-content;color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,.1);animation:slide 80s linear infinite}
.bgtext .row.r{animation-direction:reverse;animation-duration:100s}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---------- panneaux : ancienneté + appareils ---------- */
.rail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pan{padding:18px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.7);animation:enter .9s .6s cubic-bezier(.2,.8,.2,1) backwards}
.pan h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.age b{font-family:var(--display);font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,var(--st));-webkit-background-clip:text;background-clip:text;color:transparent}
.age span{margin-left:8px;color:var(--muted);font-weight:600;font-size:14px}
.hms{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;color:var(--muted);font-size:13px}
.hms b{font-family:var(--display);color:var(--ink);font-size:17px;margin-right:3px;font-variant-numeric:tabular-nums}
.note{margin-top:12px;font-size:12.5px;color:var(--muted)}
.dev{list-style:none;display:grid;gap:9px;font-size:14px;font-weight:600}
.dev li{display:flex;align-items:center;gap:10px;color:#6f6b88;transition:color .4s}
.dev li i{width:9px;height:9px;border-radius:50%;background:#3b3856;transition:all .4s}
.dev li.on{color:var(--ink)}
.dev li.on i{background:var(--st);box-shadow:0 0 12px var(--st)}
.pulse{display:block;width:100%;height:44px;margin-top:14px;overflow:visible}
.pulse path{fill:none;stroke:var(--st);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:stroke .6s}
.pulse .base-p{opacity:.18}
.pulse .live-p{stroke-dasharray:35 65;filter:drop-shadow(0 0 5px var(--st));animation:run var(--spd,2.2s) linear infinite}
.pulse .flat-p{opacity:.45}
@keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.pan.off .live-p,.pan:not(.off) .flat-p{display:none}
@media (min-width:1120px){
  .rail{display:contents}
  .pan{position:absolute;top:96px;width:250px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .pl{right:calc(100% + 34px);transform:perspective(900px) rotateY(14deg)}
  .pr{left:calc(100% + 34px);transform:perspective(900px) rotateY(-14deg)}
  .pl:hover,.pr:hover{transform:perspective(900px) rotateY(0)}
}

/* ---------- lecteur de musique ---------- */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
#yt{position:fixed;left:-9999px;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none}
.music{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;
  padding:8px 12px 8px 8px;border-radius:99px;width:max-content;max-width:min(92vw,400px);background:rgba(20,17,38,.72);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px -20px rgba(0,0,0,.8);animation:enter .9s 1s cubic-bezier(.2,.8,.2,1) backwards}
.music button{flex:none;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--a1),var(--a2));transition:transform .15s,opacity .3s}
.music button:hover{transform:scale(1.08)}.music button:active{transform:scale(.94)}
.music button:disabled{opacity:.4;cursor:default;transform:none}
.music button:focus-visible{outline:2px solid var(--a3);outline-offset:2px}
.music button.sm{width:32px;height:32px;background:rgba(255,255,255,.08)}
.music svg{width:18px;height:18px;fill:currentColor}
.music .mt{min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.music .eq{margin:0}.music .eq s{background:var(--st)}
.music:not(.on) .eq s{animation-play-state:paused;height:3px}
.music .ic-pause,.music.on .ic-play{display:none}.music.on .ic-pause{display:block}
#toast{bottom:max(84px,calc(env(safe-area-inset-bottom) + 72px))}

/* ---------- 3D, bord lumineux, intro ---------- */
canvas#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
canvas#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.card::before{content:"";position:absolute;inset:-1px;border-radius:35px;padding:1.5px;pointer-events:none;z-index:5;
  background:conic-gradient(from var(--ang),transparent 0 68%,var(--st) 84%,#fff 92%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:edge 6s linear infinite}
@keyframes edge{to{--ang:360deg}}
@keyframes shine{0%{background-position:200% 0,0 0}35%,100%{background-position:-100% 0,0 0}}
.intro .head>*,.intro .about,.intro .stack,.intro .foot{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.intro .head>:nth-child(2){animation-delay:.12s}.intro .head>:nth-child(3){animation-delay:.2s}
.intro .head>:nth-child(4){animation-delay:.28s}.intro .head>:nth-child(5){animation-delay:.36s}
.intro .about{animation-delay:.5s}.intro .stack{animation-delay:.6s}.intro .foot{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.avatar.flip{animation:flip 1.3s cubic-bezier(.3,.7,.2,1)}
@keyframes flip{from{transform:translateZ(50px) rotateY(0)}to{transform:translateZ(50px) rotateY(720deg)}}
body.rainbow .aurora,body.rainbow canvas#gl{animation:hue 2.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:60;padding:12px 20px;border-radius:99px;
  background:rgba(20,17,38,.82);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:14px;
  transition:all .6s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  canvas#stars{display:none}
}
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="bgtext" aria-hidden="true"><div class="row" id="bg1"></div><div class="row r" id="bg2"></div></div>
<canvas id="gl"></canvas>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div id="toast" role="status"></div>
<div id="yt"></div>
<div class="music" id="music">
  <button id="mp" type="button" aria-label="Lecture / pause" disabled>
    <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <span class="mt" id="mtitle">Musique</span>
  <span class="eq"><s></s><s></s><s></s></span>
  <button class="sm" id="mn" type="button" aria-label="Piste suivante" disabled>
    <svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zm10 0h2v12h-2z"/></svg>
  </button>
</div>
<div class="grain"></div>

<main class="stage">
  <section class="card skeleton" id="card" aria-live="polite">
    <div class="banner"></div>
    <div class="head">
      <div class="avatar"><div class="ring"></div></div>
      <h1>&nbsp;</h1>
    </div>
  </section>
  <div class="rail">
    <aside class="pan pl" aria-label="Ancienneté du compte">
      <h2>Ce compte existe depuis</h2>
      <div class="age"><b id="a-d">0</b><span>jours</span></div>
      <div class="hms"><span><b id="a-h">00</b>h</span><span><b id="a-m">00</b>min</span><span><b id="a-s">00</b>s</span></div>
      <p class="note" id="a-since"></p>
    </aside>
    <aside class="pan pr off" id="pulse" aria-label="Appareils">
      <h2>Connecté sur</h2>
      <ul class="dev"><li id="dv-desktop"><i></i>Ordinateur</li><li id="dv-mobile"><i></i>Mobile</li><li id="dv-web"><i></i>Navigateur</li></ul>
      <svg class="pulse" viewBox="0 0 240 44" preserveAspectRatio="none" aria-hidden="true">
        <path class="base-p" d="M0 22H70l8-2 8 2 8-14 10 30 8-16 6 0H240"/>
        <path class="live-p" pathLength="100" d="M0 22H70l8-2 8 2 8-14 10 30 8-16 6 0H240"/>
        <path class="flat-p" d="M0 22H240"/>
      </svg>
      <p class="note" id="pulse-t">Hors ligne</p>
    </aside>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const STATUS = {

  idle:{c:"#f0b232",label:"Absent",tint:["#ff9f43","#ff4fa3","#7c5cff"]},

};
const FLAGS = [[1,"Staff Discord"],[2,"Partenaire"],[4,"HypeSquad Events"],[8,"Bug Hunter"],[64,"Bravery"],[128,"Brilliance"],[256,"Balance"],[512,"Early Supporter"],[16384,"Bug Hunter Gold"],[131072,"Dev de bot vérifié"],[4194304,"Développeur actif"]];

const $ = s => document.querySelector(s);
const card = $("#card");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function avatarUrl(u){
  if(!u.avatar){ try{ return `https://cdn.discordapp.com/embed/avatars/${Number((BigInt(u.id)>>22n)%6n)}.png`; }catch(e){ return "https://cdn.discordapp.com/embed/avatars/0.png"; } }
  return `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_")?"gif":"png"}?size=256`;
}
function assetUrl(act,key){
  if(!key) return null;
  if(key.startsWith("mp:external/")) return "https://media.discordapp.net/external/" + key.slice(12);
  if(key.startsWith("mp:")) return "https://media.discordapp.net/" + key.slice(3);
  if(key.startsWith("spotify:")) return "https://i.scdn.co/image/" + key.slice(8);
  if(act.application_id) return `https://cdn.discordapp.com/app-assets/${act.application_id}/${key}.png`;
  return null;
}
const fmt = ms => {
  const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(r).padStart(2,"0");
};

function render(){
  const d = data, u = d.discord_user;

  updateRail(d, st);

  const pu = (profile && profile.user) || {};

  let badges = "";

  }
  if(profile && profile.badges && profile.badges.length){

  const acts = d.activities || [];

  let blocks = "";

  if(custom && (custom.state || custom.emoji)){

        ? `<img alt="" src="https://cdn.discordapp.com/emojis/${esc(custom.emoji.id)}.${custom.emoji.animated?"gif":"png"}?size=48">`
        : `<span>${esc(custom.emoji.name)}</span>`;

  if(d.listening_to_spotify && d.spotify){

      <div class="art"><img alt="" src="${esc(s.album_art_url)}"></div>
      <div class="txt">
        <div class="kind">Écoute sur Spotify<span class="eq"><s></s><s></s><s></s></span></div>
        <div class="name">${esc(s.song)}</div>
        <div class="sub">${esc(s.artist).replace(/;/g,",")}</div>
        <div class="bar"><b id="sp-bar"></b></div>
        <div class="time"><span id="sp-now">0:00</span> / ${fmt(s.timestamps.end - s.timestamps.start)}</div>
      </div></div>`;
  }

  acts.filter(a => a.type !== 4 && a.id !== "spotify:1" && a.name !== "Spotify").forEach(a => {
    const kinds = {0:"Joue à",1:"En stream sur",2:"Écoute",3:"Regarde",5:"En compétition sur"};
    const img = assetUrl(a, a.assets && a.assets.large_image);
    blocks += `<div class="panel">
      <div class="art">${img ? `<img alt="" src="${esc(img)}" onerror="this.remove()">` : "🎮"}</div>
      <div class="txt">

        ${a.state ? `<div class="sub">${esc(a.state)}</div>` : ""}
        ${a.timestamps && a.timestamps.start ? `<div class="time" data-start="${a.timestamps.start}"></div>` : ""}
      </div></div>`;
  });

  card.classList.remove("skeleton");
  if(!window.__intro){ window.__intro = 1; card.classList.add("intro"); setTimeout(() => card.classList.remove("intro"), 2400); }
  card.innerHTML = `
    <div class="banner"${bannerUrl ? ` style="background-image:url('${esc(bannerUrl)}')"` : ""}></div>
    <div class="head">
      <div class="avatar${deco ? " has-deco" : ""}">
        <div class="glow"></div><div class="ring"></div>
        <img alt="Avatar de ${esc(name)}" src="${avatarUrl(u)}">
        ${deco ? `<img class="deco" alt="" src="https://cdn.discordapp.com/avatar-decoration-presets/${esc(deco)}.png?size=240&passthrough=true">` : ""}
        <span class="dot ${d.discord_status==="online"?"online":""}"></span>
      </div>
      <h1>${esc(name)}</h1>
      <p class="handle">${esc(u.username)}${pronouns ? ` <span class="pron">• ${esc(pronouns)}</span>` : ""}</p>
      <span class="statut-txt"><i></i>${st.label}</span>
      ${badges ? `<div class="badges">${badges}</div>` : ""}
    </div>
    <div class="about">
      ${bio ? `<p class="bio">${esc(bio)}</p>` : ""}
      <p class="since">Membre depuis<strong>${esc(created)}</strong></p>
    </div>
    ${blocks ? `<div class="stack">${blocks}</div>` : ""}
    <div class="foot">
      <span class="live ${wsOpen?"on":""}" id="live"><i></i><span id="live-t">${wsOpen?"En direct":"Mise à jour auto"}</span></span>
      <button class="copy" id="copy" type="button">Copier le pseudo</button>
    </div>`;

  $("#copy").onclick = async e => {
    const b = e.currentTarget;
    try{ await navigator.clipboard.writeText(u.username); b.textContent = "Copié"; }
    catch(_){ b.textContent = "Copie impossible"; }
    setTimeout(()=> b.textContent = "Copier le pseudo", 1600);
  };
  tick();
}

function tick(){
  if(!data) return;
  const now = Date.now();
  document.querySelectorAll("[data-start]").forEach(el => el.textContent = "Depuis " + fmt(now - Number(el.dataset.start)));
  if(data.listening_to_spotify && data.spotify){
    const {start,end} = data.spotify.timestamps, total = end - start;
    const pos = Math.min(Math.max(now - start, 0), total);
    const bar = $("#sp-bar"), t = $("#sp-now");
    if(bar) bar.style.width = (pos/total*100) + "%";
    if(t) t.textContent = fmt(pos);
  }
}
setInterval(tick, 1000);

function setLive(on){
  wsOpen = on;
  const l = $("#live"), t = $("#live-t");

/* ---------- données : REST pour le premier affichage, WebSocket pour le temps réel ---------- */
async function load(){
  try{
    const r = await fetch(API, {cache:"no-store"});
    const j = await r.json();
    if(j.success){ data = j.data; render(); }
    else if(!data) showError("Ce compte n'est pas suivi par Lanyard. Il faut d'abord rejoindre le serveur Discord de Lanyard avec ce compte, puis recharger la page.");
  }catch(e){ if(!data) showError("Impossible de joindre l'API. Vérifie ta connexion puis recharge la page."); }
}

function connect(){
  let hb;
  let ws;
  try{ ws = new WebSocket("wss://api.lanyard.rest/socket"); }catch(e){ return; }
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if(m.op === 1){
      ws.send(JSON.stringify({op:2,d:{subscribe_to_id:ID}}));
      hb = setInterval(()=> ws.readyState===1 && ws.send(JSON.stringify({op:3})), m.d.heartbeat_interval);
    }else if(m.op === 0 && (m.t === "INIT_STATE" || m.t === "PRESENCE_UPDATE")){
      data = Object.assign({}, data || {}, m.d);
      if(data.discord_user){ setLive(true); render(); }
    }
  };
  ws.onclose = () => { clearInterval(hb); setLive(false); setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
}
load(); connect(); loadProfile();
setInterval(() => { if(!wsOpen) load(); }, 15000);

/* ---------- étoiles ---------- */
(function(){
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  let W, H, pts = [], mx = 0, my = 0;
  function size(){
    const dpr = Math.min(devicePixelRatio||1, 2);
    W = cv.width = innerWidth*dpr; H = cv.height = innerHeight*dpr;
    cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
    const n = Math.round(innerWidth*innerHeight/14000);
    pts = Array.from({length:n}, () => ({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.3+.3)*dpr,z:Math.random()*.8+.2,p:Math.random()*6.28}));
  }
  addEventListener("resize", size); size();
  addEventListener("pointermove", e => { mx = (e.clientX/innerWidth-.5); my = (e.clientY/innerHeight-.5); });
  (function loop(t){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      const a = .25 + .55*Math.abs(Math.sin(t/1800 + p.p));
      ctx.globalAlpha = a*p.z;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc((p.x - mx*40*p.z*(devicePixelRatio||1) + W)%W, (p.y - my*40*p.z*(devicePixelRatio||1) + H)%H, p.r, 0, 6.283);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  })(0);
})();

/* ---------- scène 3D : cristal, anneaux et poussière d'étoiles teintés par le statut ---------- */
(function(){
  if(!window.THREE || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const T = THREE, cv = document.getElementById("gl");
  let r; try{ r = new T.WebGLRenderer({canvas:cv, alpha:true, antialias:true}); }catch(e){ return; }
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  const sc = new T.Scene(), cam = new T.PerspectiveCamera(50, 1, .1, 100); cam.position.z = 9;
  const col = new T.Color("#80848e"); window.glTarget = new T.Color("#80848e");
  const mat = (o, w) => new T.MeshBasicMaterial({color:col, wireframe:!!w, transparent:true, opacity:o});
  const group = new T.Group(); sc.add(group);
  group.add(new T.Mesh(new T.IcosahedronGeometry(3.6,1), mat(.2,1)), new T.Mesh(new T.IcosahedronGeometry(2.2,0), mat(.4,1)));
  const rings = [0,1,2].map(i => { const m = new T.Mesh(new T.TorusGeometry(4.7+i*.8,.012,8,180), mat(.35)); m.rotation.set(i*1.1, i*.7, 0); group.add(m); return m; });
  const N = 700, pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){ const R = 5+Math.random()*10, a = Math.random()*6.283, b = Math.acos(2*Math.random()-1);
    pos.set([R*Math.sin(b)*Math.cos(a), R*Math.sin(b)*Math.sin(a), R*Math.cos(b)], i*3); }
  const g = new T.BufferGeometry(); g.setAttribute("position", new T.BufferAttribute(pos,3));
  const pts = new T.Points(g, new T.PointsMaterial({color:col, size:.05, transparent:true, opacity:.8})); sc.add(pts);
  let mx = 0, my = 0, boost = 0;
  addEventListener("pointermove", e => { mx = e.clientX/innerWidth-.5; my = e.clientY/innerHeight-.5; });
  const size = () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); };
  addEventListener("resize", size); size();
  window.glBoost = () => { boost = 1; };
  const clk = new T.Clock();
  (function loop(){
    const t = clk.getElapsedTime(), s = 1 + boost*10;
    col.lerp(glTarget, .03); boost *= .965;
    group.rotation.y += .0025*s; group.rotation.x += .0012*s;
    group.position.x += (mx*1.6 - group.position.x)*.05; group.position.y += (-my*1.1 - group.position.y)*.05;
    group.scale.setScalar(1 + Math.sin(t*1.2)*.02 + boost*.3);
    rings.forEach((m,i) => { m.rotation.z += .004*(i+1)*s; m.rotation.x += .002*s; });
    pts.rotation.y = t*.02 + mx*.25; pts.rotation.x = my*.15;
    r.render(sc, cam); requestAnimationFrame(loop);
  })();
})();

/* ---------- effets + secrets ---------- */
(function(){
  const cv = document.getElementById("fx"), c = cv.getContext("2d"); let P = [], run = false;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; addEventListener("resize", fit); fit();
  function burst(x, y, n = 90, hue){
    for(let i=0;i<n;i++){ const a = Math.random()*6.283, s = 2+Math.random()*9;
      P.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-3, life:1, h:hue ?? Math.random()*360, r:2+Math.random()*4}); }
    if(!run){ run = true; requestAnimationFrame(step); }
  }
  function step(){
    c.clearRect(0,0,cv.width,cv.height); P = P.filter(p => p.life > 0);
    for(const p of P){ p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.life -= .012;
      c.globalAlpha = Math.max(p.life,0); c.fillStyle = `hsl(${p.h},95%,65%)`; c.beginPath(); c.arc(p.x,p.y,p.r,0,6.283); c.fill(); }
    if(P.length) requestAnimationFrame(step); else { run = false; c.clearRect(0,0,cv.width,cv.height); }
  }
  const toast = document.getElementById("toast"); let tt;
  const say = m => { toast.textContent = m; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 4200); };
  const boost = () => window.glBoost && glBoost();
  const mid = el => { const b = el.getBoundingClientRect(); return [b.left+b.width/2, b.top+b.height/2]; };

  // 1. code Konami
  const K = "ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight,b,a".split(","); let ki = 0;
  // 2. mot tapé au clavier
  let typed = "";
  addEventListener("keydown", e => {
    ki = (e.key === K[ki] || e.key.toLowerCase() === K[ki]) ? ki+1 : (e.key === K[0] ? 1 : 0);
    if(ki === K.length){ ki = 0; document.body.classList.add("rainbow"); boost();
      for(let i=0;i<6;i++) setTimeout(() => burst(Math.random()*innerWidth, innerHeight*.35, 70), i*260);
      say("Mode arc-en-ciel activé"); setTimeout(() => document.body.classList.remove("rainbow"), 9000); }
    if(e.key.length === 1){ typed = (typed + e.key.toLowerCase()).slice(-5);
      if(typed === "thors"){ typed = ""; boost(); say("Tu n'as le droit de blesser personne en ce monde."); } }
  });

  // 3. avatar x7, pastille x3, pseudo maintenu
  let ac = 0, at, dc = 0, dt, st = 0, hold;
  const modes = ["online","idle","dnd","offline"];
  card.addEventListener("click", e => {
    const dot = e.target.closest(".dot"), av = e.target.closest(".avatar");
    if(dot){ clearTimeout(dt); dt = setTimeout(() => dc = 0, 1500);
      if(++dc >= 3){ dc = 0; st = (st+1) % 4; const m = STATUS[modes[st]], R = document.documentElement.style;
        R.setProperty("--st", m.c); R.setProperty("--a1", m.tint[0]); R.setProperty("--a2", m.tint[1]); R.setProperty("--a3", m.tint[2]);
        window.glTarget && glTarget.set(m.c); say("Humeur : " + m.label); setTimeout(() => data && render(), 5000); }
      return; }
    if(av){ clearTimeout(at); at = setTimeout(() => ac = 0, 4000);
      if(++ac >= 7){ ac = 0; av.classList.remove("flip"); void av.offsetWidth; av.classList.add("flip"); boost();
        const [x,y] = mid(av); burst(x, y, 140); setTimeout(() => av.classList.remove("flip"), 1400); } }
  });
  card.addEventListener("pointerdown", e => {
    if(!e.target.closest("h1")) return;
    hold = setTimeout(() => { const [x,y] = mid(e.target.closest("h1")); let n = 0;
      const iv = setInterval(() => { burst(x + (Math.random()-.5)*120, y, 22, 20 + Math.random()*35); if(++n > 14) clearInterval(iv); }, 90);
      say("🔥"); }, 1500);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => card.addEventListener(ev, () => clearTimeout(hold)));

  // 4. message dans la console
  console.log("%cTu cherches quelque chose ?", "font:700 18px Georgia;color:#c084fc");
  console.log("%cIl y a 5 secrets sur cette page. Le clavier, l'avatar, la pastille et le pseudo savent des choses.", "color:#a9a4c4");
})();

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SPLIX</title>
<link rel="icon" href="https://i.imgur.com/l4fHXmg.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@300;400;500;600&family=Space+Mono&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--r:#cc0000;--rl:#ff2222;--rg:#ff6666;--rgb:204,0,0;--rlrgb:255,100,100;--bg:#060000;--bgrgb:6,0,0}
html,body{width:100%;min-height:100vh;font-family:var(--ff,'Inter',sans-serif);color:#fff;cursor:none;background:var(--bg);overflow-x:hidden}

/* CURSOR */
#cur{position:fixed;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:transform .1s}
#cur2{position:fixed;width:36px;height:36px;border-radius:50%;border:1px solid rgba(var(--rgb),.4);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .18s ease}

/* AUDIO VISUALIZER */
#av{position:fixed;bottom:70px;left:0;right:0;height:35px;pointer-events:none;z-index:5;display:flex;align-items:flex-end;gap:1px;padding:0 20px;opacity:0;transition:opacity .3s}
#av.on{opacity:1}
.ab{flex:1;height:100%;background:linear-gradient(180deg,rgba(var(--rlrgb),.8),rgba(var(--rgb),.4));border-radius:2px;box-shadow:0 0 10px rgba(var(--rgb),.3);}

/* CANVAS */
#c{position:fixed;inset:0;z-index:0}
#c3p{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);width:100%;height:210px;z-index:100;pointer-events:none;opacity:0;transition:opacity .6s}
@media (max-width:640px){#c3p{height:175px}}
.p3d #mp{display:none!important}
.p3d #scene{padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))!important}
#c3p.open{height:400px}
@media (max-width:640px){#c3p.open{height:365px}}
#spWrap{position:fixed;left:50%;bottom:calc(218px + env(safe-area-inset-bottom,0px));width:min(380px,92vw);height:152px;z-index:95;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transform:translate(-50%,24px);transition:opacity .45s,transform .45s}
#spWrap.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#spWrap.pk{opacity:0!important;pointer-events:none!important}
#spWrap iframe{display:block;width:100%;height:152px;border:0}
@media (max-width:640px){#spWrap{bottom:calc(183px + env(safe-area-inset-bottom,0px))}}
#c3d{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* INTRO */
#intro{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px}
#il{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(3rem,12vw,6rem);letter-spacing:.3em;background:linear-gradient(135deg,#fff 0%,var(--rg) 50%,var(--r) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
#ib-w{width:160px;height:1px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
#ib{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,transparent,var(--rl),#fff);box-shadow:0 0 20px var(--r)}

/* SCENE */
#scene{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px 110px;opacity:0}
.wrap{width:100%;max-width:var(--ww,400px);display:flex;flex-direction:column;align-items:center;gap:10px}

/* PROFILE */
.pc{width:100%;border-radius:var(--radp,22px);overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(30px);box-shadow:0 20px 60px rgba(0,0,0,.7);opacity:0;position:relative}
.pc::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(var(--rgb),.06) 0%,transparent 60%);pointer-events:none;z-index:1}
.bn{width:100%;height:120px;object-fit:cover;display:block}
.av-row{padding:0 16px;margin-top:-36px;position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between}
.av{width:72px;height:72px;border-radius:50%;border:3px solid var(--bg);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.8)}
.av img{width:100%;height:100%;object-fit:cover}
.dot{width:14px;height:14px;border-radius:50%;background:#23a55a;border:3px solid var(--bg);position:absolute;bottom:3px;right:3px}
.av-wrap{position:relative;display:inline-block}
.badges-inline{display:flex;gap:6px;padding-bottom:4px}
.bi{padding:4px 10px;border-radius:20px;background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.2);font-size:.5rem;letter-spacing:1px;color:rgba(var(--rlrgb),.6);text-transform:uppercase}
.pb{padding:10px 16px 16px;position:relative;z-index:2}
.pname{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;letter-spacing:2px;margin-bottom:3px}
.ptag{font-size:.55rem;letter-spacing:2px;color:rgba(255,255,255,.25);margin-bottom:10px}
.bio{font-size:.75rem;color:rgba(255,255,255,.35);line-height:1.65;font-weight:300}

/* PRESENCE DISCORD */
.dot{transition:background .4s}
.pres{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px}
.pres[hidden]{display:none}
.ps{display:flex;align-items:center;gap:7px;font-size:.48rem;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.28)}
.ps i{width:6px;height:6px;border-radius:50%;background:#80848e;flex-shrink:0;transition:background .4s}
.ps b{font-weight:500;color:rgba(255,255,255,.55)}
.cst{display:flex;align-items:center;gap:7px;font-size:.7rem;color:rgba(255,255,255,.55);font-weight:300;line-height:1.5;word-break:break-word}
.cst img{width:18px;height:18px;object-fit:contain;flex-shrink:0}
.cst:empty,#acts:empty{display:none}
#acts{display:flex;flex-direction:column;gap:8px}
.ar{display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;background:rgba(var(--rgb),.06);border:1px solid rgba(var(--rgb),.14);text-decoration:none;color:inherit;transition:background .3s,border-color .3s}
a.ar:hover{background:rgba(var(--rgb),.11);border-color:rgba(var(--rgb),.3)}
.ai{width:42px;height:42px;border-radius:9px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:.95rem}
.ai img{width:100%;height:100%;object-fit:cover;display:block}
.at{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.al{font-size:.44rem;letter-spacing:2.5px;color:rgba(var(--rlrgb),.55);text-transform:uppercase}
.an{font-size:.68rem;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as{font-size:.58rem;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.pg{height:2px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--rl);border-radius:2px;transition:width 1s linear}

/* COMMUNAUTE */
.vc{font-size:.5rem;letter-spacing:3px;color:rgba(255,255,255,.28);text-transform:uppercase;text-align:center;padding-top:2px}
.vc[hidden]{display:none}
.vc i{margin-right:6px;color:rgba(var(--rlrgb),.5)}
@keyframes cmIn{from{opacity:0;transform:translateY(16px) scale(.97)}}

.div{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.25),rgba(255,255,255,.08),transparent);margin:2px 0;opacity:0}

.card{width:100%;display:flex;align-items:center;text-decoration:none;color:#fff;padding:14px 16px;border-radius:var(--rad,14px);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);transition:all .3s cubic-bezier(.34,1.56,.64,1);cursor:none;position:relative;overflow:hidden;opacity:0}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.04) 50%,transparent 65%);transform:translateX(-100%);transition:transform .5s}
.card:hover::after{transform:translateX(100%)}
.card:hover{background:rgba(var(--rgb),.08);border-color:rgba(var(--rgb),.25);transform:translateX(4px);box-shadow:-3px 0 20px rgba(var(--rgb),.08)}
.ci{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.95rem;color:rgba(255,255,255,.35);margin-right:13px;flex-shrink:0;transition:all .3s}
.gi{font-family:'Orbitron',sans-serif;font-weight:900;font-size:.82rem;transform:rotate(-10deg) skewX(-5deg);display:block}
.card:hover .ci{background:rgba(var(--rgb),.15);border-color:rgba(var(--rgb),.3);color:var(--rg)}
.ct{flex:1}
.cs{font-size:.44rem;letter-spacing:3px;color:rgba(255,255,255,.2);text-transform:uppercase;display:block;margin-bottom:2px;transition:color .3s}
.cn{font-size:.65rem;font-weight:500;letter-spacing:3px;color:rgba(255,255,255,.6);transition:all .3s}
.card:hover .cs{color:rgba(var(--rlrgb),.4)}
.card:hover .cn{color:#fff}
.ca{margin-left:auto;color:rgba(255,255,255,.15);font-size:.55rem;transition:all .3s;transform:translateX(-3px)}
.card:hover .ca{color:rgba(var(--rgb),.6);transform:translateX(3px)}

.ft{font-size:.42rem;letter-spacing:5px;color:rgba(255,255,255,.1);text-transform:uppercase;text-align:center;opacity:0;padding-top:4px}

/* BOUTONS 3D */
.card{overflow:visible;backdrop-filter:none;-webkit-backdrop-filter:none;transform-style:preserve-3d;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),rgba(var(--bgrgb),.55);border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(var(--rgb),.5),0 4px 0 rgba(var(--rgb),.34),0 6px 0 rgba(var(--rgb),.2),0 16px 26px rgba(0,0,0,.55)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(var(--rlrgb),.2),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card::after{border-radius:inherit;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;transform:none;transition:background-position .7s;pointer-events:none}
.card:hover::after{transform:none;background-position:-50% 0}
.card:hover{transform:none;background:linear-gradient(145deg,rgba(var(--rgb),.24),rgba(var(--rgb),.05)),rgba(var(--bgrgb),.6);border-color:rgba(var(--rgb),.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 rgba(var(--rgb),.7),0 6px 0 rgba(var(--rgb),.45),0 9px 0 rgba(var(--rgb),.25),0 22px 34px rgba(0,0,0,.6),0 0 30px rgba(var(--rgb),.15)}
.card:active{translate:0 5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(var(--rgb),.6),0 8px 12px rgba(0,0,0,.5)}
.card .ci{transform:translateZ(26px);box-shadow:0 2px 0 rgba(var(--rgb),.3),0 8px 14px rgba(0,0,0,.5)}
.card .ct{transform:translateZ(16px)}
.card .ca{transform:translateZ(12px) translateX(-3px)}
.card:hover .ca{transform:translateZ(12px) translateX(3px)}
.mb{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);box-shadow:0 3px 0 rgba(255,255,255,.07),0 6px 12px rgba(0,0,0,.4)}
.mb:active{translate:0 3px;box-shadow:0 0 0 rgba(255,255,255,.07),0 1px 3px rgba(0,0,0,.4)}
.mb.main{border:none;box-shadow:0 4px 0 rgba(0,0,0,.45),0 4px 0 1px rgba(var(--rgb),.55),0 10px 20px rgba(var(--rgb),.4)}
.mb.main:hover{box-shadow:0 5px 0 rgba(0,0,0,.45),0 5px 0 1px var(--rl),0 12px 26px rgba(255,34,34,.5)}
.mb.main:active{translate:0 4px;box-shadow:0 0 0 rgba(0,0,0,.45),0 0 0 1px rgba(var(--rgb),.55),0 2px 8px rgba(var(--rgb),.4)}

#mp{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:14px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px)) 24px;background:rgba(var(--bgrgb),.9);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(40px);opacity:0;transition:opacity .4s}
#mp::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.5),transparent)}
.ma{width:38px;height:38px;border-radius:8px;overflow:hidden;flex-shrink:0}
.ma img{width:100%;height:100%;object-fit:cover}
.mi{flex:1;min-width:0}
.mt{font-size:.58rem;letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ms{font-size:.42rem;letter-spacing:2px;color:rgba(255,255,255,.2);margin-top:2px}
.mc{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mb{background:none;border:none;color:rgba(255,255,255,.3);cursor:none;font-size:.85rem;transition:all .2s;padding:7px;border-radius:50%;display:flex;align-items:center}
.mb:hover{color:#fff;background:rgba(255,255,255,.08)}
.mb.act{color:var(--rl);background:rgba(var(--rgb),.22)}
.mb.main{width:34px;height:34px;background:var(--r);color:#fff;font-size:.85rem;justify-content:center;border-radius:50%;box-shadow:0 0 20px rgba(var(--rgb),.4)}
.mb.main:hover{background:var(--rl);box-shadow:0 0 30px rgba(255,34,34,.5)}
.meq{display:flex;align-items:flex-end;gap:2px;height:14px;margin-left:6px}
.meq span{display:block;width:2px;background:var(--r);border-radius:1px;opacity:0;transition:opacity .3s;animation:eq .7s ease-in-out infinite alternate}
.meq span:nth-child(1){height:5px}.meq span:nth-child(2){height:11px;animation-delay:.1s}.meq span:nth-child(3){height:7px;animation-delay:.2s}.meq span:nth-child(4){height:13px;animation-delay:.08s}.meq span:nth-child(5){height:4px;animation-delay:.18s}
.meq.on span{opacity:.8}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}

/* VOLUME */
.vol{position:relative;display:flex;align-items:center}
#volBtn.open{color:#fff;background:rgba(var(--rgb),.25)}
.vpanel{position:absolute;right:0;bottom:calc(100% + 22px);display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:16px;background:rgba(var(--bgrgb),.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.7);backdrop-filter:blur(20px);z-index:120;animation:cmIn .2s ease}
.vpanel[hidden]{display:none}
.vpanel .mb{width:30px;height:30px;justify-content:center;font-size:.8rem}
#vol{-webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:2px;outline:none;cursor:none;background:linear-gradient(90deg,var(--rl) var(--v,60%),rgba(255,255,255,.12) var(--v,60%))}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(var(--rgb),.6);border:none}
#vol::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(var(--rgb),.6);border:none}
#vol::-moz-range-track{background:transparent}
#volPct{font-size:.58rem;letter-spacing:1px;color:rgba(255,255,255,.6);min-width:32px;text-align:right}
@media (max-width:520px){
  #mp{padding-left:14px;padding-right:14px;gap:10px}
  .meq{display:none}
  #vol{width:90px}
}

#player{position:fixed;width:200px;height:200px;left:0;bottom:0;opacity:.01;pointer-events:none;z-index:-1}

a,button{-webkit-tap-highlight-color:transparent}
@media (hover:none),(pointer:coarse){
  *{cursor:auto!important}
  #cur,#cur2{display:none!important}
}

/* ============ STYLES DU LECTEUR ============ */
body:not(.p3d) #spWrap{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.pl-off #spWrap{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
body.pl-off #mp{display:none!important}
body.pl-off #c3p{display:none!important}
body.pl-off #scene{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))!important}
body.pl-pill #mp{left:50%;right:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100vw - 24px));padding:8px 14px;border:1px solid rgba(var(--rgb),.35);border-radius:999px;box-shadow:0 10px 36px rgba(0,0,0,.6),0 0 24px rgba(var(--rgb),.15)}
body.pl-pill #mp::before,body.pl-pill .ms,body.pl-pill .meq{display:none}
body.pl-pill .ma{width:32px;height:32px;border-radius:50%}
body.pl-pill #scene{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))!important}
body.pl-pill #av{bottom:64px}

/* ============ DISPOSITION DES LIENS ============ */
body.lay-compact .wrap{gap:8px}
body.lay-compact .card{padding:8px 12px}
body.lay-compact .ci{width:28px;height:28px;margin-right:10px;font-size:.8rem}
body.lay-compact .cs{display:none}
body.lay-grid .wrap{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:stretch}
body.lay-grid .pc,body.lay-grid .div,body.lay-grid .ft,body.lay-grid .vc{flex:0 0 100%}
body.lay-grid .card{flex:0 0 calc(50% - 5px);width:auto;flex-direction:column;text-align:center;padding:16px 10px}
body.lay-grid .ci{margin:0 0 8px}
body.lay-grid .ct{flex:none}
body.lay-grid .cn{letter-spacing:2px}
body.lay-grid .ca{display:none}

/* ============ STYLES DES CARTES ============ */
body.st-flat .card,body.st-flat .card:hover{box-shadow:none!important;background:rgba(255,255,255,.04)!important}
body.st-flat .card:hover{border-color:rgba(var(--rgb),.5)!important;background:rgba(var(--rgb),.1)!important}
body.st-flat .card:active{translate:0 2px}
body.st-glass .card{background:rgba(255,255,255,.07)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important;box-shadow:0 8px 30px rgba(0,0,0,.4)!important;border-color:rgba(255,255,255,.16)!important}
body.st-glass .card:hover{background:rgba(var(--rgb),.16)!important;border-color:rgba(var(--rlrgb),.45)!important}
body.st-neon .card{background:rgba(0,0,0,.45)!important;border-color:rgba(var(--rlrgb),.55)!important;box-shadow:0 0 0 1px rgba(var(--rgb),.45),0 0 16px rgba(var(--rgb),.3),inset 0 0 14px rgba(var(--rgb),.12)!important}
body.st-neon .card:hover{background:rgba(var(--rgb),.14)!important;box-shadow:0 0 0 1px rgba(var(--rlrgb),.8),0 0 30px rgba(var(--rgb),.6),inset 0 0 20px rgba(var(--rgb),.25)!important}
body.st-neon .card:active{translate:0 2px}

/* ============ OPTIONS D'AFFICHAGE ============ */
body.nocur #cur,body.nocur #cur2{display:none!important}
body.nocur,body.nocur *{cursor:auto!important}
body.nocur a,body.nocur button{cursor:pointer!important}
body.hide-av #av{display:none!important}
body.hide-banner .bn{display:none}
body.hide-banner .av-row{margin-top:0;padding-top:16px}
body.hide-badges .badges-inline{display:none}
body.hide-bio .bio{display:none}
body.hide-pres #pres{display:none!important}
body.hide-ft #eFT{display:none}
body.hide-pc #ePC{display:none}

/* ============ PANNEAU PARAMETRES ============ */
#cfgB{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:410;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(var(--bgrgb),.7);color:rgba(255,255,255,.8);font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 3px 0 rgba(var(--rgb),.45),0 8px 18px rgba(0,0,0,.5);opacity:0;animation:cfgIn .5s 2.8s forwards;cursor:none;transition:color .2s,border-color .2s}
#cfgB:hover{color:#fff;border-color:rgba(var(--rgb),.7)}
#cfgB i{display:inline-block;transition:transform .5s}
#cfgB:hover i,#cfgB.open i{transform:rotate(90deg)}
@keyframes cfgIn{to{opacity:1}}
#cfgP{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);z-index:400;display:flex;flex-direction:column;background:rgba(var(--bgrgb),.95);border-left:1px solid rgba(var(--rgb),.3);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:-20px 0 60px rgba(0,0,0,.6);transform:translateX(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;font:13px/1.4 'Inter',sans-serif;color:#fff}
#cfgP.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* PARAMETRES (valeurs par defaut + sauvegarde) */
var CFGDEF={shape:'E',shapeOn:true,render:'mix',size:1,speed:1,pos:'auto',ico:true,ring:true,p3:true,pulse:true,lay:'cards',cst:'3d',rad:'md',wid:'m',ui:100,font:'inter',theme:'auto',player:'3d',vis:true,stars:true,glow:true,tilt:true,par:true,cur:true,banner:true,badges:true,bio:true,pres:true,ft:true,pc:true};
var CFG={};for(var _i in CFGDEF)CFG[_i]=CFGDEF[_i];
try{var _sc=JSON.parse(localStorage.getItem('leerCfg')||'null');if(_sc)for(var _k in _sc)if(_k in CFGDEF&&typeof _sc[_k]===typeof CFGDEF[_k])CFG[_k]=_sc[_k]}catch(e){}
if(CFG.shape==='L')CFG.shape='E';
var themeLock=CFG.theme!=='auto';

/* AUDIO ANALYSIS POUR VISUALISEUR */
var audioCtx=null,analyser=null,dataArray=null,bassEnergy=0,midEnergy=0,trebleEnergy=0;
function initAudioAnalysis(){
  if(audioCtx||!player)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    dataArray=new Uint8Array(analyser.frequencyBinCount);
    var src=audioCtx.createMediaElementAudioSource(document.getElementById('player'));
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    document.getElementById('av').classList.add('on');
  }catch(e){}
}
function updateAudioLevels(){
  if(!analyser)return;
  try{
    analyser.getByteFrequencyData(dataArray);
    var len=dataArray.length,b=0,m=0,t=0,s=len/3;
    for(var i=0;i<len;i++){
      if(i<s)b+=dataArray[i];else if(i<s*2)m+=dataArray[i];else t+=dataArray[i];
    }
    bassEnergy=(b/s/256)*.8+(bassEnergy*.2);
    midEnergy=(m/s/256)*.8+(midEnergy*.2);
    trebleEnergy=(t/s/256)*.8+(trebleEnergy*.2);
    var av=document.getElementById('av');
    if(av.children.length<len){av.innerHTML='';for(var j=0;j<len;j++){var b=document.createElement('div');b.className='ab';av.appendChild(b)}}
    var bars=av.querySelectorAll('.ab');
    for(var k=0;k<Math.min(bars.length,len);k++){var h=Math.pow(dataArray[k]/256,1.8)*100;bars[k].style.height=(35+h*70)+'px'}
  }catch(e){}
}

/* YOUTUBE */
var player,started=false,mpReady=false,playedOnce=false,lastG=0,errN=0,curPl=0,shuffleOn=true;
try{if(localStorage.getItem('leerShuffle')==='0')shuffleOn=false}catch(e){}

/* BOUCLE (repeter la piste) */
var loopOne=false;
try{loopOne=localStorage.getItem('leerLoop')==='1'}catch(e){}
function syncLoop(){
  var b=document.getElementById('loopBtn');
  if(!b)return;
  b.classList.toggle('act',loopOne);
  b.setAttribute('aria-pressed',String(loopOne));
  b.title=loopOne?'Répéter la piste : activé':'Répéter la piste : désactivé';
}
function toggleLoop(){
  loopOne=!loopOne;
  try{localStorage.setItem('leerLoop',loopOne?'1':'0')}catch(e){}
  syncLoop();
}
syncLoop();

/* VOLUME */
var vol=60,muted=false;
try{var sv=localStorage.getItem('leerVol');if(sv!==null&&isFinite(+sv))vol=Math.max(0,Math.min(100,+sv))}catch(e){}
function applyVol(){
  var v=document.getElementById('vol'),ic=document.getElementById('volI');
  if(v){v.value=vol;v.style.setProperty('--v',(muted?0:vol)+'%')}
  var cls='fa-solid '+((muted||vol===0)?'fa-volume-xmark':vol<40?'fa-volume-low':'fa-volume-high');
  if(ic)ic.className=cls;
  var mi=document.getElementById('vMuteI');if(mi)mi.className=cls;
  var pc=document.getElementById('volPct');if(pc)pc.textContent=(muted?0:vol)+'%';
  if(mpReady&&player){
    if(muted||vol===0)player.mute();
    else{player.unMute();player.setVolume(vol)}
  }
}
function toggleMute(){
  if(vol===0){vol=50;muted=false}else muted=!muted;
  try{localStorage.setItem('leerVol',vol)}catch(e){}
  applyVol();
}
function stepVol(d){
  vol=Math.max(0,Math.min(100,vol+d));muted=false;
  try{localStorage.setItem('leerVol',vol);localStorage.setItem('leerMuted','0')}catch(e){}
  applyVol();
}
function toggleVolPanel(e){
  if(e)e.stopPropagation();
  var p=document.getElementById('vPanel'),b=document.getElementById('volBtn');
  p.hidden=!p.hidden;b.classList.toggle('open',!p.hidden);b.setAttribute('aria-expanded',String(!p.hidden));
}
function closeVolPanel(){
  var p=document.getElementById('vPanel'),b=document.getElementById('volBtn');
  if(p.hidden)return;p.hidden=true;b.classList.remove('open');b.setAttribute('aria-expanded','false');
}
document.addEventListener('click',function(e){if(!e.target.closest('#volWrap'))closeVolPanel()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeVolPanel()});
document.addEventListener('DOMContentLoaded',function(){
  var v=document.getElementById('vol');
  v.addEventListener('input',function(){
    vol=+v.value;muted=false;
    try{localStorage.setItem('leerVol',vol);localStorage.setItem('leerMuted','0')}catch(e){}
    applyVol();
  });
  applyVol();
});

function onYouTubeIframeAPIReady(){
  var pv={listType:'playlist',list:'PLPMWvmH_Lej8',autoplay:1,controls:0,rel:0,playsinline:1,loop:1};
  if(location.protocol.indexOf('http')===0)pv.origin=location.origin;
  player=new YT.Player('player',{
    height:'200',width:'200',
    playerVars:pv,
    events:{
      onReady:function(e){mpReady=true;applyVol();e.target.setShuffle(shuffleOn);try{e.target.setLoop(true)}catch(err){}e.target.playVideo();showMP();updateMeta();initAudioAnalysis()},
      onStateChange:function(e){var p=e.data===1;document.getElementById('mpI').className=p?'fa-solid fa-pause':'fa-solid fa-play';document.getElementById('mpEq').classList.toggle('on',p);if(p){started=true;playedOnce=true;errN=0;updateMeta()}if(e.data===0){if(loopOne){try{player.seekTo(0,true);player.playVideo()}catch(err){}return}var list=player.getPlaylist&&player.getPlaylist(),idx=player.getPlaylistIndex&&player.getPlaylistIndex();if(list&&list.length&&idx>=list.length-1)player.playVideoAt(0);else player.nextVideo()}},
      onError:function(e){var M={2:'Lien de playlist invalide',5:'Erreur du lecteur',100:'Video introuvable',101:'Lecture bloquee par le proprietaire',150:'Lecture bloquee par le proprietaire',153:'Lecture impossible (ouvre le site en ligne, pas en fichier local)'};document.getElementById('mpT').textContent='Erreur '+e.data+' : '+(M[e.data]||'lecture impossible');errN++;if(mpReady&&errN<6)setTimeout(function(){player.nextVideo()},800)}
    }
  });
}
function updateMeta(){if(!player||!player.getVideoData)return;setTimeout(function(){var d=player.getVideoData();if(d&&d.title)document.getElementById('mpT').textContent=d.title;if(d&&d.video_id){var img=document.querySelector('#mp .ma img');img.onerror=function(){img.onerror=null;img.src='https://i.imgur.com/j5WwXDA.jpg'};img.src='https://i.ytimg.com/vi/'+d.video_id+'/hqdefault.jpg'}},800)}
function showMP(){document.getElementById('mp').style.opacity='1';document.getElementById('scene').style.paddingBottom='calc(90px + env(safe-area-inset-bottom, 0px))'}
function toggleMusic(){if(!mpReady)return;if(!started){player.playVideo();started=true;showMP();initAudioAnalysis();return}if(player.getPlayerState()===1)player.pauseVideo();else player.playVideo()}
function prevTrack(){if(!mpReady)return;player.previousVideo();setTimeout(updateMeta,1000)}
function nextTrack(){if(!mpReady)return;player.nextVideo();setTimeout(updateMeta,1000)}
setTimeout(function(){if(!mpReady)document.getElementById('mpT').textContent='Lecteur YouTube non charge (bloqueur de pub ou connexion ?)'},9000);
function startGesture(){
  if(playedOnce){['pointerdown','touchend','keydown','click'].forEach(function(n){window.removeEventListener(n,startGesture,true)});return}
  if(curPl!==0)return;
  if(!mpReady||!player)return;
  try{if(muted||vol===0){player.mute()}else{player.unMute();player.setVolume(vol)}player.playVideo()}catch(e){}
  lastG=Date.now();started=true;showMP();initAudioAnalysis();
}
['pointerdown','touchend','keydown','click'].forEach(function(n){window.addEventListener(n,startGesture,true)});
setInterval(updateAudioLevels,50);

/* EASING */
var E={oE:function(t){return t>=1?1:1-Math.pow(2,-10*t)},oB:function(t){var c=2.70158;return 1+c*Math.pow(t-1,3)+(c-1)*Math.pow(t-1,2)},oEl:function(t){return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1},oQ:function(t){return 1-Math.pow(1-t,4)},oC:function(t){return 1-Math.pow(1-t,3)},iOQ:function(t){return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2},iE:function(t){return t===0?0:Math.pow(2,10*t-10)},iOC:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}};
function an(c){var f=c.from,to=c.to,ms=c.ms,ea=c.ease||E.oE,dl=c.delay||0,tk=c.tick,dn=c.done;var t0=performance.now()+dl;function r(n){if(n<t0){requestAnimationFrame(r);return}var p=Math.min((n-t0)/ms,1);tk(f+(to-f)*ea(p),p);if(p<1)requestAnimationFrame(r);else if(dn)dn()}requestAnimationFrame(r)}
function S(el,o){Object.assign(el.style,o)}

/* THEME */
var T={h:0,s:100,rgb:'204,0,0',lrgb:'255,100,100',bg:'6,0,0'};
function h2r(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))}return [f(0),f(8),f(4)]}
function rgb2h(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return [h,s,l]}
function setTheme(h,s){h=((h%360)+360)%360;s=Math.max(55,Math.min(100,s));T.h=h;T.s=s;var c=h2r(h,s,40),l=h2r(h,s,57),g=h2r(h,s,70),b=h2r(h,Math.min(s,80),1.2);T.rgb=c.join(',');T.lrgb=g.join(',');T.bg=b.join(',');var st=document.documentElement.style;st.setProperty('--r','rgb('+T.rgb+')');st.setProperty('--rl','rgb('+l.join(',')+')');st.setProperty('--rg','rgb('+T.lrgb+')');st.setProperty('--rgb',T.rgb);st.setProperty('--rlrgb',T.lrgb);st.setProperty('--bg','rgb('+T.bg+')');st.setProperty('--bgrgb',T.bg)}
var _tw=0;
function shiftTheme(h,s,force){if(!force&&themeLock)return;var h0=T.h,s0=T.s,dh=((h-h0+540)%360)-180,ds=Math.max(55,Math.min(100,s))-s0,id=++_tw;an({from:0,to:1,ms:900,ease:E.oC,tick:function(v){if(id===_tw)setTheme(h0+dh*v,s0+ds*v)}});try{localStorage.setItem('leerTheme',JSON.stringify({h:h,s:s}))}catch(e){}}
try{var _ct=JSON.parse(localStorage.getItem('leerTheme')||'null');if(_ct&&isFinite(_ct.h)&&isFinite(_ct.s))setTheme(_ct.h,_ct.s)}catch(e){}

/* CURSOR */
var cA=document.getElementById('cur'),cB=document.getElementById('cur2'),mx=0,my=0,lx=0,ly=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;cA.style.left=mx+'px';cA.style.top=my+'px'});
(function lp(){lx+=(mx-lx)*.1;ly+=(my-ly)*.1;cB.style.left=lx+'px';cB.style.top=ly+'px';requestAnimationFrame(lp)})();
document.querySelectorAll('.card,.pc').forEach(function(el){el.addEventListener('mouseenter',function(){S(cB,{width:'50px',height:'50px',borderColor:'rgba(var(--rgb),.6)'})});el.addEventListener('mouseleave',function(){S(cB,{width:'36px',height:'36px',borderColor:'rgba(var(--rgb),.4)'})})});

/* CANVAS */
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  function rsz(){cv.width=innerWidth;cv.height=innerHeight}rsz();window.addEventListener('resize',rsz);
  var pts=Array.from({length:280},function(){return{x:Math.random(),y:Math.random(),r:.1+Math.random()*1.2,op:.05+Math.random()*.7,tw:1+Math.random()*3.5,tp:Math.random()*Math.PI*2,sp:.00003+Math.random()*.00015,red:Math.random()>.65}}),sh=[{x:Math.random()*.7,y:Math.random()*.45,t:0,len:80+Math.random()*130,spd:.002+Math.random()*.004,delay:Math.random()*500},{x:Math.random()*.7,y:Math.random()*.45,t:0,len:80+Math.random()*130,spd:.002+Math.random()*.004,delay:Math.random()*500},{x:Math.random()*.7,y:Math.random()*.45,t:0,len:80+Math.random()*130,spd:.002+Math.random()*.004,delay:Math.random()*500}],blobs=[{x:.15,y:.2,r:.3,h:0,op:.06,vx:.0001,vy:.00008},{x:.8,y:.75,r:.25,h:5,op:.05,vx:-.00009,vy:.00007},{x:.5,y:.5,r:.18,h:355,op:.04,vx:.00007,vy:-.0001}],rv=0,t=0,mX=.5,mY=.5;
  window._rv=function(v){rv=v};
  document.addEventListener('mousemove',function(e){mX=e.clientX/innerWidth;mY=e.clientY/innerHeight});
  function fr(){

/* ============ PANNEAU DE PARAMETRES ============ */
(function(){
  var B=document.body,R=document.documentElement,$=function(i){return document.getElementById(i)};
  var FONTS={inter:"'Inter',sans-serif",orb:"'Orbitron',sans-serif",mono:"'Space Mono',monospace",raj:"'Rajdhani',sans-serif"};
  var SW=[['red','#cc0000',0,100],['orange','#e07000',24,100],['yellow','#d6b400',48,100],['green','#16a34a',140,75],['cyan','#00b4cc',186,100],['blue','#2563eb',220,100],['purple','#8b2fe0',272,90],['pink','#e0189a',322,100]];
  var TABS=[['ui','Interface'],['sh','Forme 3D'],['pl','Lecteur'],['ds','Affichage']];
  var tab='ui',lastPlayer=null;

  function save(){try{localStorage.setItem('leerCfg',JSON.stringify(CFG))}catch(e){}}
  function cls(n,on){B.classList.toggle(n,!!on)}

  function applyPlayer(){
    var ok=!!window.__p3dOK,m=CFG.player,is3=ok&&m==='3d',c=$('c3p');
    if(m==='3d'&&!ok)m='bar';
    B.classList.toggle('p3d',is3);
    cls('pl-bar',m==='bar');cls('pl-pill',m==='pill');cls('pl-off',m==='off');
    window.__p3dOn=is3;
    if(c)c.style.display=is3?'':'none';
    if(lastPlayer!==CFG.player){lastPlayer=CFG.player;setTimeout(function(){window.dispatchEvent(new Event('resize'))},40)}
  }
  function apply(){
    cls('lay-compact',CFG.lay==='compact');cls('lay-grid',CFG.lay==='grid');
    cls('st-flat',CFG.cst==='flat');cls('st-glass',CFG.cst==='glass');cls('st-neon',CFG.cst==='neon');
    R.style.setProperty('--rad',{sq:'4px',md:'14px',rd:'28px'}[CFG.rad]||'14px');
    R.style.setProperty('--radp',{sq:'6px',md:'22px',rd:'34px'}[CFG.rad]||'22px');
    R.style.setProperty('--ww',{s:'340px',m:'400px',l:'480px'}[CFG.wid]||'400px');
    R.style.fontSize=(16*CFG.ui/100)+'px';
    R.style.setProperty('--ff',FONTS[CFG.font]||FONTS.inter);
    cls('nocur',!CFG.cur);cls('hide-av',!CFG.vis);cls('hide-banner',!CFG.banner);cls('hide-badges',!CFG.badges);
    cls('hide-bio',!CFG.bio);cls('hide-pres',!CFG.pres);cls('hide-ft',!CFG.ft);cls('hide-pc',!CFG.pc);
    applyPlayer();
    if(window.__setShape)window.__setShape(CFG.shape);
  }

  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
  function sec(p,t){p.appendChild(el('div','cs2',t))}
  function chips(p,label,key,opts){
    var r=el('div','cr col');r.appendChild(el('div','cl',label));var w=el('div','chips');
    opts.forEach(function(o){
      var b=el('button','chip'+(CFG[key]===o[0]?' on':''),o[1]);b.type='button';
      b.onclick=function(){CFG[key]=o[0];save();apply();render()};
      w.appendChild(b)});
    r.appendChild(w);p.appendChild(r)}
  function tog(p,label,key){
    var r=el('div','cr');r.appendChild(el('div','cl',label));
    var b=el('button','tg'+(CFG[key]?' on':''));b.type='button';b.setAttribute('role','switch');b.setAttribute('aria-checked',String(!!CFG[key]));b.setAttribute('aria-label',label);b.appendChild(el('i'));
    b.onclick=function(){CFG[key]=!CFG[key];save();apply();render()};
    r.appendChild(b);p.appendChild(r)}
  function range(p,label,key,min,max,step,fmt){
    var r=el('div','cr col'),h=el('div','rh');h.appendChild(el('div','cl',label));
    var v=el('span','rv',fmt(CFG[key]));h.appendChild(v);r.appendChild(h);
    var i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=CFG[key];i.setAttribute('aria-label',label);
    i.oninput=function(){CFG[key]=+i.value;v.textContent=fmt(CFG[key]);apply()};
    i.onchange=save;
    r.appendChild(i);p.appendChild(r)}
  function swatches(p){
    var r=el('div','cr col');r.appendChild(el('div','cl','Couleur d’accent'));var w=el('div','sws');
    var a=el('button','chip'+(CFG.theme==='auto'?' on':''),'Auto (Discord)');a.type='button';
    a.onclick=function(){CFG.theme='auto';themeLock=false;save();if(window.__dcRefresh)window.__dcRefresh();render()};
    w.appendChild(a);
    SW.forEach(function(s){
      var b=el('button','sw'+(CFG.theme===s[0]?' on':''));b.type='button';b.style.background=s[1];b.setAttribute('aria-label',s[0]);
      b.onclick=function(){CFG.theme=s[0];themeLock=true;save();shiftTheme(s[2],s[3],true);render()};
      w.appendChild(b)});
    r.appendChild(w);p.appendChild(r)}

  function build(p){
    if(tab==='ui'){
      chips(p,'Disposition des liens','lay',[['cards','Cartes'],['compact','Compacte'],['grid','Grille']]);
      chips(p,'Style des cartes','cst',[['3d','3D'],['flat','Plat'],['glass','Verre'],['neon','Néon']]);
      chips(p,'Arrondi','rad',[['sq','Carré'],['md','Normal'],['rd','Rond']]);
      chips(p,'Largeur','wid',[['s','Étroite'],['m','Normale'],['l','Large']]);
      range(p,'Taille de l’interface','ui',80,130,5,function(v){return v+'%'});
      chips(p,'Police','font',[['inter','Inter'],['orb','Orbitron'],['mono','Mono'],['raj','Rajdhani']]);
      swatches(p);
    }else if(tab==='sh'){
      chips(p,'Forme 3D','shape',[['E','Lettre E'],['knot','Nœud'],['cube','Cube'],['crystal','Cristal'],['torus','Tore']]);
      tog(p,'Afficher la forme','shapeOn');
      chips(p,'Rendu','render',[['mix','Mixte'],['wire','Filaire'],['solid','Plein']]);

      chips(p,'Position','pos',[['auto','Auto'],['center','Centre'],['left','Gauche'],['right','Droite']]);
      sec(p,'Décors 3D');
      tog(p,'Sphère filaire','ico');
      tog(p,'Anneau','ring');
      tog(p,'Particules 3D','p3');
      tog(p,'Pulsation sur la musique','pulse');
    }else if(tab==='pl'){
      chips(p,'Style du lecteur','player',[['3d','Vinyle 3D'],['bar','Barre'],['pill','Pilule'],['off','Masqué']]);

        window.__PL.forEach(function(it,i){

          b.onclick=function(){window.__choose(i);setTimeout(render,60)};
          w.appendChild(b)});
        r.appendChild(w);p.appendChild(r)}
      var r2=el('div','cr');r2.appendChild(el('div','cl','Répéter la piste (boucle)'));
      var lb=el('button','tg'+(loopOne?' on':''));lb.type='button';lb.setAttribute('role','switch');lb.setAttribute('aria-checked',String(loopOne));lb.setAttribute('aria-label','Répéter la piste');lb.appendChild(el('i'));
      lb.onclick=function(){toggleLoop();render()};
      r2.appendChild(lb);p.appendChild(r2);
      tog(p,'Visualiseur audio (barres)','vis');
      p.appendChild(el('div','hint','Le style « Masqué » cache le lecteur sans couper la musique. La boucle ne fonctionne pas sur la playlist Spotify.'));
    }else{
      sec(p,'Fond');
      tog(p,'Étoiles & étoiles filantes','stars');
      tog(p,'Halos de couleur','glow');
      sec(p,'Effets');
      tog(p,'Inclinaison 3D au survol','tilt');
      tog(p,'Parallaxe','par');
      tog(p,'Curseur personnalisé','cur');
      sec(p,'Carte profil');
      tog(p,'Afficher la carte profil','pc');
      tog(p,'Bannière','banner');
      tog(p,'Badges','badges');
      tog(p,'Bio','bio');
      tog(p,'Présence Discord','pres');
      sec(p,'Page');
      tog(p,'Pied de page','ft');
    }
  }
  function render(){
    var tb=$('cfgT'),bd=$('cfgBody'),sc=bd.scrollTop;
    tb.textContent='';bd.textContent='';
    TABS.forEach(function(t){
      var b=el('button','tab'+(tab===t[0]?' on':''),t[1]);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(tab===t[0]));
      b.onclick=function(){tab=t[0];render();$('cfgBody').scrollTop=0};
      tb.appendChild(b)});
    build(bd);
    bd.scrollTop=sc;
  }

  /* construction du panneau */
  var btn=el('button','');btn.id='cfgB';btn.type='button';btn.setAttribute('aria-label','Paramètres');btn.setAttribute('aria-expanded','false');btn.innerHTML='<i class="fa-solid fa-gear"></i>';
  var pan=el('div');pan.id='cfgP';pan.setAttribute('role','dialog');pan.setAttribute('aria-label','Paramètres');
  pan.innerHTML='<div class="ch"><b>PARAMÈTRES</b><button type="button" id="cfgX" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button></div><div id="cfgT" role="tablist"></div><div id="cfgBody"></div><div class="cf"><button type="button" id="cfgR">Réinitialiser les paramètres</button></div>';
  B.appendChild(btn);B.appendChild(pan);

  function setOpen(on){

    if(on)render();
  }
  btn.onclick=function(){setOpen(!pan.classList.contains('open'))};
  $('cfgX').onclick=function(){setOpen(false)};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&pan.classList.contains('open'))setOpen(false)});
  $('cfgR').onclick=function(){
    Object.keys(CFGDEF).forEach(function(k){CFG[k]=CFGDEF[k]});
    themeLock=false;save();
    shiftTheme(0,100,true);
    if(window.__dcRefresh)setTimeout(window.__dcRefresh,1000);
    apply();render();
  };

  apply();
})();
